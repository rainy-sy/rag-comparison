<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>孚瑞肯 RAG 回答对照</title>
  <style>
    :root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#243349;background:#f3f6fa}*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;flex-direction:column}header{flex:none;padding:16px 24px 12px;background:#fff;border-bottom:1px solid #dce5ef;box-shadow:0 2px 12px #1d365408}h1{font-size:20px;color:#173b70;margin:0 0 12px}nav{display:flex;gap:10px}nav a{display:flex;align-items:center;justify-content:center;min-height:44px;padding:10px 18px;border:1px solid #cedcf2;border-radius:9px;color:#255b99;background:#edf4fd;text-decoration:none;font-size:14px;font-weight:700;line-height:1.5}nav a:hover{background:#dceafa}nav a[aria-current="page"]{background:#245caa;border-color:#245caa;color:white}nav a:focus-visible{outline:3px solid #d99428;outline-offset:3px}iframe{display:block;flex:1;min-height:0;width:100%;border:0;background:#f3f6fa}@media(max-width:600px){header{padding:12px}h1{font-size:17px;margin-bottom:10px}nav{gap:8px}nav a{flex:1;padding:9px 8px;font-size:13px}}
  </style>
</head>
<body>
  <header>
    <h1>孚瑞肯 RAG · 回答对照报告</h1>
    <nav aria-label="切换报告">
      <a href="history.html" target="report-frame" data-report="history" aria-current="page">01 历史三渠道对照</a>
      <a href="updated.html" target="report-frame" data-report="updated">02 更新后网站与 WorkBuddy 对照</a>
    </nav>
  </header>
  <iframe name="report-frame" id="report-frame" src="history.html" title="历史三渠道对照"></iframe>
  <script>
    const frame = document.getElementById('report-frame');
    const links = Array.from(document.querySelectorAll('[data-report]'));
    function selectReport(key) {
      const selected = links.find(link => link.dataset.report === key) || links[0];
      links.forEach(link => {
        if (link === selected) link.setAttribute('aria-current', 'page');
        else link.removeAttribute('aria-current');
      });
      if (frame.getAttribute('src') !== selected.getAttribute('href')) frame.src = selected.getAttribute('href');
      frame.title = selected.textContent.trim();
    }
    links.forEach(link => link.addEventListener('click', event => {
      if (event.button !== 0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
      event.preventDefault();
      selectReport(link.dataset.report);
      history.replaceState(null, '', '#' + link.dataset.report);
    }));
    window.addEventListener('hashchange', () => selectReport(location.hash.slice(1)));
    selectReport(location.hash.slice(1));
  </script>
</body>
</html>
